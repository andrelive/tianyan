[package]
name = "tianyan-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "HTTP server for Tianyan"

[dependencies]
tianyan-core = { path = "../core" }
tianyan-mcp = { path = "../mcp" }
# 服务层配置 crate（ADR-049 期 3-T4）：加载 / 持久化（段保全）/ 数据目录迁移 / 校验 /
# 向导 DTO 从 core 搬出后由通道层直接调用——它们是「配置怎么落盘、搬迁怎么保数据」的
# 运维语义，不属于内核机制。方向正确（server 是使用方，被依赖方是 core 与服务层）。
tianyan-service-config = { path = "../service/config" }

# HTTP server
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tower = { version = "0.5", features = ["util"] }

# Core dependencies
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
tracing = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"

# Utilities
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
similar = { workspace = true }
base64 = { workspace = true }
dirs = "6.0"

[lints]
workspace = true

[lib]
name = "tianyan_server"
path = "src/lib.rs"
# 禁用 doctest：与 core 同步，避免改动后 doctest 目标全量重编（全量测试 378.8s → 约 2 分钟）
doctest = false

# bin（tianyan-server 可执行文件）已迁至 `tianyan-app` 包（ADR-049 期 1：
# 装配清单必须住在依赖插件的包里，否则改一行工具会重编 server 库）。

[dev-dependencies]
reqwest = { workspace = true, features = ["blocking"] }
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
# 集成测试的**真实装配**（ADR-049 期 4）：`tests/common/factory.rs::test_assembly()`
# 只取 `tianyan_assembly::policies()`——11 个工厂与两份清单的唯一实现都在那里，
# 本包不再手抄一份（改造前这里还有 9 个工厂的第二份副本）。
#
# **依赖形状是 dev-dependency 环**：`tianyan-assembly` 依赖本包（取 `AssemblyServices`
# 与插槽类型别名），本包又把它作为 dev-dep。Cargo 允许——dev-dep 不参与**构建**图的
# 环检测，测试目标的依赖图里 server lib 只编一份。它与 core 的「同源包含 + dev-dep
# 编两份」陷阱不是一回事（见 `core/src/vfs/backend/mod.rs`）：那是 `#[path]` 把同一批
# 源文件编进两个 crate，这里是两个独立 crate 的正常依赖。
#
# 代价：server 的测试目标会连带编译 assembly 的全部依赖（含 LanceDB 链），首次
# `cargo test -p tianyan-server` 变慢；换来「9 个工厂只有一份实现」，插槽变化在
# 编译期暴露而不是某个装配器运行期缺件。
tianyan-assembly = { path = "../assembly" }
# core 的测试替身（`MockVfs` / `MockChatService`）作为**特性构建**打开：本库的插槽
# 测试要构造 `ContextServices`（含 `Arc<dyn VirtualFileSystem>`），不打开就只能
# 复制一份替身（两份实现同时漂移）。仅测试构建生效，`cargo tree -p tianyan-server`
# 生产图里没有 mockall。
tianyan-core = { path = "../core", features = ["test-utils"] }

[[bench]]
name = "api_benchmarks"
harness = false
