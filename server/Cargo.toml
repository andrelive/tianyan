[package]
name = "tianyan-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "HTTP server for Tianyan"

[dependencies]
tianyan-core = { path = "../core" }
tianyan-mcp = { path = "../mcp" }

# HTTP server
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tower = { version = "0.5", features = ["util"] }

# Core dependencies
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
tracing = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"

# Utilities
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
similar = { workspace = true }
base64 = { workspace = true }
dirs = "6.0"

[lints]
workspace = true

[lib]
name = "tianyan_server"
path = "src/lib.rs"
# 禁用 doctest：与 core 同步，避免改动后 doctest 目标全量重编（全量测试 378.8s → 约 2 分钟）
doctest = false

# bin（tianyan-server 可执行文件）已迁至 `tianyan-app` 包（ADR-049 期 1：
# 装配清单必须住在依赖插件的包里，否则改一行工具会重编 server 库）。

[dev-dependencies]
reqwest = { workspace = true, features = ["blocking"] }
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
# 集成测试的**真实装配**（ADR-049 序 4）：`tests/common/factory.rs::test_assembly()`
# 注入真实 SqliteBackend / LocalFileBackend。无循环依赖（插件只依赖 core，不依赖
# server），因此不会出现 core 那种「同一 crate 两个编译单元」问题。
tianyan-storage-sqlite = { path = "../plugins/storage-sqlite" }

[[bench]]
name = "api_benchmarks"
harness = false
