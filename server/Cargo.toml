[package]
name = "tianyan-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "HTTP server for Tianyan"

[dependencies]
tianyan-core = { path = "../core" }
tianyan-mcp = { path = "../mcp" }

# HTTP server
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tower = { version = "0.5", features = ["util"] }

# Core dependencies
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
tracing = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"

# Utilities
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
similar = { workspace = true }
base64 = { workspace = true }
dirs = "6.0"

[lints]
workspace = true

[lib]
name = "tianyan_server"
path = "src/lib.rs"
# 禁用 doctest：与 core 同步，避免改动后 doctest 目标全量重编（全量测试 378.8s → 约 2 分钟）
doctest = false

# bin（tianyan-server 可执行文件）已迁至 `tianyan-app` 包（ADR-049 期 1：
# 装配清单必须住在依赖插件的包里，否则改一行工具会重编 server 库）。

[dev-dependencies]
reqwest = { workspace = true, features = ["blocking"] }
tempfile = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
# 集成测试的**真实装配**（ADR-049 序 4）：`tests/common/factory.rs::test_assembly()`
# 注入真实 SqliteBackend / LocalFileBackend。无循环依赖（插件只依赖 core，不依赖
# server），因此不会出现 core 那种「同一 crate 两个编译单元」问题。
tianyan-storage-sqlite = { path = "../plugins/storage-sqlite" }
# 内置定时任务实现（ADR-049 期 2 序 5a）：集成测试的 `test_assembly()` 注入真实
# 任务清单，保住「`start_server*` 会注册 5 个内置任务」这条可观测行为。
# 同样无循环（插件只依赖 core，不依赖 server）。
tianyan-task-builtin = { path = "../plugins/task-builtin" }
# 自演化综述任务实现（ADR-049 期 2 序 5b）：`test_assembly()` 里与 builtin 拼接
# （`splice(1..1, …)`，与 `app`/`tauri` 同形），保住「演化任务排第 2 位」这条顺序
# 纪律在集成测试里也被覆盖。同样无循环。
tianyan-task-evolution = { path = "../plugins/task-evolution" }
# 审批策略实现（ADR-049 期 3-T1）：集成测试的 `test_assembly()` 注入**真实**审批门控
# ——否则「黑名单命令被审批层复核」「审批状态接口返回真实配置」这些可观测行为在
# 集成测试里测的就不是生产形态（与序 4 的「兜底后端」同一条纪律）。同样无循环。
tianyan-policy-approval = { path = "../plugins/policy-approval" }
# 上下文策略实现（ADR-049 期 3-T2）：集成测试的 `test_assembly()` 注入**真实**管线
# ——否则 `create_app` 出来的 agent 会落到 core 的空直通兜底（无 system 前缀 + 不压缩），
# 集成测试测的就不是生产形态（与序 4 的「兜底后端」同一条纪律）。无循环。
tianyan-policy-context = { path = "../plugins/policy-context" }
# 评审策略实现（ADR-049 期 3-T3）：集成测试的 `test_assembly()` 同样注入**真实**评审器
# ——否则 `/api/v1/skills/stats` 的 reviews 永远为空（读端口未装配），测的就不是生产形态。
# 与上下文策略同一条纪律：只用 dev-dep，生产图里没有插件（无循环）。
tianyan-policy-review = { path = "../plugins/policy-review" }
# core 的测试替身（`MockVfs` / `MockChatService`）作为**特性构建**打开：本库的插槽
# 测试要构造 `ContextServices`（含 `Arc<dyn VirtualFileSystem>`），不打开就只能
# 复制一份替身（两份实现同时漂移）。仅测试构建生效，`cargo tree -p tianyan-server`
# 生产图里没有 mockall。
tianyan-core = { path = "../core", features = ["test-utils"] }

[[bench]]
name = "api_benchmarks"
harness = false
