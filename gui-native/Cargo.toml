[workspace]

[package]
name = "tianyan-gui-native"
# 版本与 server / tauri 版对齐（打包成 MSI 后 ARP 里显示的就是这个号，
# 三处不一致会让「替换 tauri 版」看起来像换了个产品）
version = "1.1.1"
edition = "2021"
description = "天演原生桌面客户端（GPUI，与 gui-vite 并存）"
publish = false

[dependencies]
# 天演内核与装配：与 tauri/ 同源同形（同一个 assembly 清单，不另写一份）
tianyan-core = { path = "../core" }
tianyan-server = { path = "../server" }
tianyan-service-config = { path = "../service/config" }
tianyan-assembly = { path = "../assembly" }
# 启动编排（单 server 发现与复用）：与 tauri/ 共用同一份实现 ——
# 端口探测只避免端口冲突，不能避免「两个 server 同写一个数据目录」。
tianyan-desktop = { path = "../desktop" }

# GPUI 门面（绑 gpui-pre 快照）。
# tree-sitter* 必须显式开启，否则 Editor 静默无高亮。
# 与天演共用同一个 tree-sitter 0.26（带 `links` 属性，同一二进制只能一个版本）；
# 天演侧已从 0.25 升到 0.26（代码零改动，32 个 tools-code 测试全过）。
gpui-kit = { version = "0.6", features = ["tree-sitter", "tree-sitter-rust"] }

# 与后端同进程通信（HTTP/SSE，与 gui-vite 走同一套协议）
tokio = { version = "1.35", features = ["full"] }
# stream：SSE 常驻订阅要按块读响应体（`Response::bytes_stream`）
# multipart：知识页导入要传文件（服务端 `ingest_handler` 收 multipart）
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
serde_json = "1.0"
# 用户消息图片：data URL 是 base64，要解码成字节交给 GPUI 的 `Image::from_bytes`
base64 = "0.22"
# 消息时间（对齐 vite：流式轮次开始时打本地时间 HH:mm:ss）
chrono = "0.4"
# 自动化端口（ADR-052）：只在 `TIANYAN_GUI_AUTOMATION_PORT` 存在时监听
axum = "0.8"
futures = "0.3"
tracing = "0.1"
anyhow = "1.0"
# 系统通知（D1）：Windows toast。与 tauri 版同一个底层（`tauri-plugin-notification`
# 的 Windows 后端也是 notify-rust 的 WinRT 实现），只是没有 Tauri 那层插件壳。
notify-rust = "4"
# AUMID 注册（通知归属的应用标识）：HKCU 下写一个 key，无需管理员。
# 不注册也能弹，但通知会显示成 `Windows PowerShell`（WinRT 的默认 AppID）。
winreg = "0.52"
# 系统托盘（D2）：`tray-icon` 是 tauri 生态的托盘库；它的 Windows 后端要求
# 「创建托盘的线程上有 win32 消息循环」——不必是主线程，见 `tray.rs` 的独立线程。
tray-icon = "0.24"
# 托盘图标解码：`tray-icon::Icon` 要 RGBA 缓冲，而资源是 PNG（`include_bytes!`
# 嵌进二进制，不依赖安装目录里有图片文件）
png = "0.17"
# Win32 窗口显隐（GPUI 只暴露 minimize/activate，没有 hide）：`ShowWindow` +
# `EnumWindows` 找本进程主窗口。与 tray-icon 共用同一个 windows 0.62。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # 全局快捷键：RegisterHotKey 在 Input::KeyboardAndMouse
    "Win32_UI_Input_KeyboardAndMouse",
    # 隐藏自带的控制台窗口（GetConsoleWindow / GetConsoleProcessList）
    "Win32_System_Console",
] }
# 图片解码 / 转码（**常规依赖**，不是只给截图用）：
# Windows 的剪贴板截图（Win+Shift+S）给的是 **BMP**，而后端 `ChatRequest` 的
# data URL 白名单只有 PNG/JPEG/WebP/GIF —— 原样发过去直接 400「不支持的图片格式」。
# 所以在本地解码（bmp 为主）再重编码成 PNG。内建截图存盘（`RgbaImage::save`）也用它。
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }

[features]
# 内建截图（`Window::render_to_image`）依赖 gpui 的 `test-support`。
# 内建截图（`Window::render_to_image`）依赖 gpui 的 `test-support`。
# **默认关闭**：那个 feature 会打开 gpui 的测试支撑代码（含额外传输后端），
# 生产 MSI 不该带。只在需要像素级验证时 `--features screenshot` 构建。
screenshot = ["gpui-kit/test-support"]

# 打包：把应用图标嵌进 exe 的 Windows 资源（见 build.rs）。
# 只在构建阶段用，不进二进制依赖。
[build-dependencies]
winres = "0.1"

# 发布构建：去掉符号表。
# 实测 288MB → 约 90MB（MSI 会从 61MB 降到 30MB 上下）——安装包大小对用户是
# 直观体验，而崩溃定位靠 `panic_hook` 写日志 + 复现，符号表收益不足以抵消体积。
[profile.release]
strip = "symbols"

# 开发构建下让 GPUI / 组件库 / 文本栈走 release 级优化
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

