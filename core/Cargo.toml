[package]
name = "tianyan-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core library for Tianyan - A local intelligent agent system powered by large language models"
readme = "../README.md"
keywords = ["agent", "ai", "llm", "assistant"]
categories = ["development-tools"]

[lib]
name = "tianyan"
path = "src/lib.rs"
# 禁用 doctest：9 个示例（4 有效）冷编译 ~60s、热循环每次 ~11s，运行仅 1.7s，性价比极低
doctest = false

[dependencies]
# Core dependencies
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
config = { workspace = true }
thiserror = { workspace = true }

# Cryptography
ring = { workspace = true }

# JSON Schema generation
schemars = { workspace = true }

# Document processing
pulldown-cmark = { workspace = true }
pdf-extract = { workspace = true }
docx-rs = { workspace = true }

# Image processing
image = { workspace = true }
# EXIF 解析：crate 名是 exif（package 名 kamadak-exif），knowledge/image 在用
kamadak-exif = { workspace = true }

# Data processing
csv = { workspace = true }
calamine = { workspace = true }

# Async utilities
async-trait = { workspace = true }
futures = { workspace = true }

# Time handling
chrono = { workspace = true }

# UUID generation
uuid = { workspace = true }

# URL parsing
url = { workspace = true }

# TOML parsing
toml = { workspace = true }

# Directory handling
dirs = { workspace = true }

# Base64 encoding
base64 = { workspace = true }



# Usage statistics
rusqlite = { workspace = true }
dashmap = { workspace = true }

# Regular expressions

# 文本相似度比较
similar = { workspace = true }

# 压缩 / 解压
flate2 = { workspace = true }




# 文件系统事件监听（事件驱动触发，T1 路线）
notify = "8"

# 测试替身（ADR-049 期 2 序 5a）：`test_utils`（MockVfs / MockChatService）默认
# **不编译**，只在 `test-utils` 特性下作为公开 API 出现——插件 crate 的单元测试
# 要复用它（否则搬走的测试无处可取替身，只能复制一份 → 两份实现同时漂移）。
# 可选依赖：`cargo tree -p tianyan-core`（默认特性）里没有 mockall。
mockall = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
mockall = { workspace = true }

[features]
default = []
# 把 `test_utils` 作为公开 API 编译（默认构建不含）。消费者写法：
# `[dev-dependencies] tianyan = { path = "../../core", package = "tianyan-core",
#  features = ["test-utils"] }`——插件自身的测试构建因此能拿到 MockVfs /
# MockChatService，而**生产构建**（`cargo build`）不受影响。
test-utils = ["dep:mockall"]

[[test]]
name = "structural"
path = "tests/structural.rs"
