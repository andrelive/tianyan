[package]
name = "tianyan-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core library for Tianyan - A local intelligent agent system powered by large language models"
readme = "../README.md"
keywords = ["agent", "ai", "llm", "assistant"]
categories = ["development-tools"]

[lib]
name = "tianyan"
path = "src/lib.rs"
# 禁用 doctest：9 个示例（4 有效）冷编译 ~60s、热循环每次 ~11s，运行仅 1.7s，性价比极低
doctest = false

[dependencies]
# Core dependencies
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
config = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Cryptography
ring = { workspace = true }

# JSON Schema generation
schemars = { workspace = true }
lancedb.workspace = true

# Document processing
pulldown-cmark = { workspace = true }
pdf-extract = { workspace = true }
docx-rs = { workspace = true }

# Image processing
image = { workspace = true }
kamadak-exif = { workspace = true }

# Data processing
csv = { workspace = true }
calamine = { workspace = true }

# Async utilities
async-trait = { workspace = true }
futures = { workspace = true }

# OpenAI API client
async-openai = { workspace = true }

# Time handling
chrono = { workspace = true }

# Cron 调度表达式解析（定时任务真实 cron 语义）
cron = { workspace = true }

# UUID generation
uuid = { workspace = true }

# URL parsing
url = { workspace = true }

# TOML parsing
toml = { workspace = true }

# Directory handling
dirs = { workspace = true }

# Base64 encoding
base64 = { workspace = true }



# Usage statistics
rusqlite = { workspace = true }
dashmap = { workspace = true }

# Regular expressions
regex = { workspace = true }

# 目录遍历（rg 同作者：.gitignore/隐藏文件语义，搜索内嵌用）
ignore = { workspace = true }
arrow-array = "58.4.0"
arrow-schema = "58.4.0"

# 文本相似度比较
similar = { workspace = true }
# unified diff 解析与应用（apply_patch 标准组件）
diffy = { workspace = true }
scraper = "0.20"

# 压缩 / 解压
flate2 = { workspace = true }

# Cargo 元数据解析
cargo_metadata = { workspace = true }

# 语法解析（tree-sitter）
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-go = { workspace = true }

# LSP 协议类型
lsp-types = { workspace = true }

# 文件系统事件监听（事件驱动触发，T1 路线）
notify = "8"

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
mockall = { workspace = true }

[features]
default = []

[[test]]
name = "structural"
path = "tests/structural.rs"
