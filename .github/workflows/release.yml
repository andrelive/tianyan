name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # 质量门禁（复用 quality.yml）：红 → build 被跳过 → 不出包。
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    needs: quality
    runs-on: windows-latest
    # 创建 GitHub Release 需要 contents: write 权限
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui-vite/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # cargo 构建缓存：第二次起只重编译改动部分（首次仍全量，~2 小时）
      - uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: cd gui-vite && npm ci

      - name: Build frontend
        run: cd gui-vite && npm run build

      - name: Install protoc (lance-encoding build dependency)
        uses: arduino/setup-protoc@v3

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri (signed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd tauri && cargo tauri build

      - name: Generate latest.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          # 固定取 en-US 一份（updater 用单一 URL；zh-CN/en-US 安装包内容同构，
          # 二选一即可）——避免"任意 First 1"选到 zh 的 msi + en 的 sig 这类
          # 不配对组合（url 与 signature 必须来自同一安装包）。
          $msi = Get-ChildItem "target/release/bundle/msi/*_en-US.msi" | Select-Object -First 1
          if (-not $msi) { throw "找不到 MSI 产物（target/release/bundle/msi/*_en-US.msi）" }
          # .sig 与 msi 同 basename 配对（Tauri 签名产物命名 = <msi 全名>.sig）
          $sigPath = "$($msi.FullName).sig"
          if (-not (Test-Path $sigPath)) {
            throw "找不到签名文件：$sigPath（检查 bundle.createUpdaterArtifacts=true 与 TAURI_SIGNING_PRIVATE_KEY secret）"
          }
          $signature = Get-Content $sigPath -Raw
          $url = "https://github.com/andrelive/tianyan/releases/download/$tag/$($msi.Name)"
          $json = @{
            version = $version
            notes = "Tianyan $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $url
              }
            }
          }
          $json | ConvertTo-Json -Depth 5 | Set-Content -Path latest.json -Encoding UTF8
          Write-Output "latest.json generated for $version"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.sig
            latest.json
