name: Quality

# 质量门禁（0.3.15 恢复）：CI 之前只有 release.yml（tag 发布构建），
# 无任何测试检查——本地 `scripts/test.ps1` 的 lint 段又因 clippy 存量告警
# 与脚本自身缺陷（PowerShell 把 cargo stderr 当错误）长期不可达。
# 本工作流覆盖当前已达标的三类门禁：
#   1. Rust fmt
#   2. Rust clippy（`-D warnings`；存量告警已于 0.3.15 清零）
#   3. Rust 单元测试（core/server/mcp；tauri 需桌面依赖，排除）
#   4. 工具目录 freshness（运行时注册 = schema 唯一真相源）
#   5. 前端 lint（eslint + prettier）/ typecheck / vitest
#
# 排障手册：CI 自身的挂死 / 日志丢失 / 编译指纹类问题见
# docs/operations/ci-pipeline.md（本文件多处注释即其结论来源）。

# 触发策略（2026-09-18 调整，用户要求"只有打 tag 才编译构建"）：
# - master 推送**不再**触发质量门禁（每次推送都跑 clippy/test/前端检查，
#   耗时长且噪声大；此前"每次推送都会构建"的来源）；
# - 打 tag（v*）触发本门禁 + release.yml 发布构建（发布前的全量把关）；
# - PR 触发供评审（不影响日常推送）。
on:
  push:
    tags:
      - 'v*'
  pull_request:
  # 手动触发：可在不移动 tag（不连带触发 release 构建）的前提下单独重跑
  # Quality，便于排查门禁问题。
  workflow_dispatch:
  # 可复用工作流：release.yml 的 build 依赖本工作流（`needs: quality`）——
  # 门禁红则不出包（"门禁必红但 MSI 已发布"事故的机制性修复）。
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui-vite/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # tag 推送（refs/tags/*）既非默认分支也非 PR，Swatinem/rust-cache 默认
      # **不保存**缓存 → 每次 tag CI 都冷编译重型依赖（lance / datafusion /
      # pdf-extract，约 21 分钟）。显式 save-if 让其保存，后续 run 才能复用
      # （0.6.3 实测：缓存生效后 Build tests 从 30:53 降到 04:40）。
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: true

      # protoc：lance-encoding（lancedb 依赖）构建脚本需要——release.yml 同款；
      # 此前 quality.yml 缺失，Linux runner 上 cargo clippy/test 编译第一步即失败
      # （"Could not find `protoc`"，2026-09-17 CI 实测）。
      - name: Install protoc (lance-encoding build dependency)
        uses: arduino/setup-protoc@v3

      - name: Rust fmt check
        run: cargo fmt --all -- --check
      - name: Rust clippy (deny warnings)
        run: cargo clippy --workspace --exclude tianyan-tauri --all-targets -- -D warnings

      # ────────────────────────────────────────────────────────────────────
      # ⚠️ 包集合纪律（0.6.3 实发事故）：cargo 的 feature 统一范围取决于
      # 「本次命令选中的包集合」——`--workspace --exclude X` 与 `-p A` 编出的
      # 产物**编译指纹不同**，前一步的编译会被整棵作废（实测：core 1/2 步骤
      # 15 分钟全程 "Compiling"，一个测试都没跑到就被 timeout 杀掉）。
      # 故：**预编译步骤与使用它的测试步骤必须同包集合、逐字一致**（差异只允许
      # `--no-run` / 测试过滤 / `--test-threads`，它们不影响编译指纹）。
      # 这里存在两组集合（core 单独 / server+mcp），各配一条预编译。
      # ────────────────────────────────────────────────────────────────────
      - name: "Build tests (compile only: core)"
        run: cargo test -p tianyan-core --lib --no-run
        timeout-minutes: 45

      - name: "Build tests (compile only: server + mcp)"
        run: cargo test -p tianyan-server -p tianyan-mcp --lib --no-run
        timeout-minutes: 20

      # 复用验证（防线，别删）：与下面测试步骤**逐字相同**的参数再各跑一次
      # --no-run。秒级返回 ⇒ 指纹一致、产物复用成立；又是十几分钟 ⇒ 有人改了
      # 上面的包集合，测试步骤将从头重编（正是 0.6.3 事故）。
      # 输出 tee 到 diag.txt 并就近上传 artifact —— runner 失联时 job 日志会
      # 整体丢失，artifact 是唯一可靠通道（见 ci-pipeline.md §2）。
      - name: "Diagnostics (reuse probe + disk/mem)"
        run: |
          set +e
          {
            echo "=== disk / mem ==="; df -h /; du -sh target 2>/dev/null || true; free -m
            echo "=== timing: core --no-run (expect <10s) ==="
            time cargo test -p tianyan-core --lib --no-run
            echo "=== timing: server+mcp --no-run (expect <10s) ==="
            time cargo test -p tianyan-server -p tianyan-mcp --lib --no-run
          } 2>&1 | tee diag.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-probe-${{ github.run_id }}
          path: diag.txt
          retention-days: 5

      # ────────────────────────────────────────────────────────────────────
      # 单元测试：**libtest（线程模型）+ 按模块分片**。
      #
      # 为何弃用 cargo-nextest（0.6.3 全程排查的结论，别改回去）：
      # nextest 是 process-per-test（每个测试一个进程）。在 4 核免费 runner 上
      # 累积创建上千进程/负载后，runner 会**失去与 GitHub 的通信**并整份丢掉
      # job 日志，Annotation 原文：
      #   "The hosted runner lost communication with the server. Anything in your
      #    workflow that terminates the runner process, starves it for CPU/Memory…"
      # 同一批 1683 个测试的实测对照：
      #   - libtest 单线程全量         ✅ 全过（1683 ok / 44s）
      #   - libtest 按模块（2 线程）   ✅ 全过（连续 3 轮，19 个模块）
      #   - nextest 分 4 片            ❌ 前 3 片过、第 4 片挂（进程/负载累积）
      #   - nextest 只跑 4/4 片        ✅ 7s（⇒ 不是测试自身的问题，是累积）
      # 另：本机（Windows）用 nextest 同命令全绿 ⇒ "本地绿 / CI 红"长期无解；
      # libtest 下两端一致（本机 core 全量 1485 测试 22s）。
      #
      # 代价：放弃 nextest 的 SLOW 提示 + terminate-after，改为
      # `--test-threads=2` 限并发 + 步骤级 timeout-minutes 兜底；
      # `::group::` 让每个模块在 UI 里可折叠，失败时一眼看到是哪个模块。
      # 末尾的 core 全量是**兜底**（新模块/无模块前缀的测试），代价约 +35s。
      # ────────────────────────────────────────────────────────────────────
      - name: "Rust unit tests (libtest: core by module)"
        run: |
          set -euo pipefail
          for m in agent common config context db events executor goals knowledge model observability role_store roles scheduler session skills snapshot todos vfs; do
            echo "::group::module $m"
            cargo test -p tianyan-core --lib -- "${m}::" --test-threads=2
            echo "::endgroup::"
          done
          echo "::group::core full (兜底：新增模块 / 无模块前缀的测试)"
          cargo test -p tianyan-core --lib -- --test-threads=2
          echo "::endgroup::"
        timeout-minutes: 20

      - name: "Rust unit tests (libtest: server + mcp)"
        run: cargo test -p tianyan-server -p tianyan-mcp --lib -- --test-threads=2
        timeout-minutes: 10

      # 集成测试（core/tests + server/tests，含 HTTP 级 e2e）——此前只在本地
      # `test.ps1 integration` 跑，CI 从未覆盖；0.5.8 记录"三处 e2e 断言失效
      # 长期未被察觉"即该缺口所致。
      - name: Rust integration tests (incl. e2e)
        run: cargo test --workspace --exclude tianyan-tauri --test "*"

      # 工具目录 freshness：命令来自仓库 `.cargo/config.toml` 的 alias
      # （`catalog-check`）——**命令单一来源**，CI 不再内联 cargo 命令行，
      # 杜绝"生成器换包/换位置后 CI 未同步"的漂移。0.5.9 实发事故：生成器
      # 由 core 迁到 server 侧（组件工具也要进目录），本地脚本已改而 CI 里
      # 内联的 `-p tianyan-core` 未同步 → `no example target named
      # tool_catalog` → 门禁必红 → release 的 build 因 `needs: quality`
      # 被跳过（tag 推送后不出包）。换生成器位置现在只改 `.cargo/config.toml`。
      - name: Tool catalog freshness
        run: cargo catalog-check

      - name: Frontend deps
        run: cd gui-vite && npm ci

      - name: Frontend lint (eslint + prettier)
        run: cd gui-vite && npm run lint

      - name: Frontend typecheck
        run: cd gui-vite && npm run typecheck

      - name: Frontend unit tests
        run: cd gui-vite && npm test
