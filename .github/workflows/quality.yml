name: Quality

# 质量门禁（0.3.15 恢复）：CI 之前只有 release.yml（tag 发布构建），
# 无任何测试检查——本地 `scripts/test.ps1` 的 lint 段又因 clippy 存量告警
# 与脚本自身缺陷（PowerShell 把 cargo stderr 当错误）长期不可达。
# 本工作流覆盖当前已达标的三类门禁：
#   1. Rust fmt
#   2. Rust clippy（`-D warnings`；存量告警已于 0.3.15 清零）
#   3. Rust 单元测试（core/server/mcp；tauri 需桌面依赖，排除）
#   4. 工具目录 freshness（运行时注册 = schema 唯一真相源）
#   5. 前端 lint（eslint + prettier）/ typecheck / vitest

# 触发策略（2026-09-18 调整，用户要求"只有打 tag 才编译构建"）：
# - master 推送**不再**触发质量门禁（每次推送都跑 clippy/test/前端检查，
#   耗时长且噪声大；此前"每次推送都会构建"的来源）；
# - 打 tag（v*）触发本门禁 + release.yml 发布构建（发布前的全量把关）；
# - PR 触发供评审（不影响日常推送）。
on:
  push:
    tags:
      - 'v*'
  pull_request:
  # 手动触发：可在不移动 tag（不连带触发 release 构建）的前提下单独重跑
  # Quality，便于排查 unit tests 卡死等门禁问题。
  workflow_dispatch:
  # 可复用工作流：release.yml 的 build 依赖本工作流（`needs: quality`）——
  # 门禁红则不出包（"门禁必红但 MSI 已发布"事故的机制性修复）。
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui-vite/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # tag 推送（refs/tags/*）既非默认分支也非 PR，Swatinem/rust-cache 默认
      # **不保存**缓存 → 每次 tag CI 都冷编译重型依赖（lance / datafusion /
      # pdf-extract，约 21 分钟），这也是"unit tests 步骤一编译就逼近超时"的
      # 放大器。显式 save-if 让其保存，后续 run 才能复用缓存。
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: true

      # protoc：lance-encoding（lancedb 依赖）构建脚本需要——release.yml 同款；
      # 此前 quality.yml 缺失，Linux runner 上 cargo clippy/test 编译第一步即失败
      # （"Could not find `protoc`"，2026-09-17 CI 实测）。
      - name: Install protoc (lance-encoding build dependency)
        uses: arduino/setup-protoc@v3

      - name: Rust fmt check
        run: cargo fmt --all -- --check
      - name: Rust clippy (deny warnings)
        run: cargo clippy --workspace --exclude tianyan-tauri --all-targets -- -D warnings

      # CI 资源诊断（0.6.3 CI 排查）：runner 曾在测试步骤"失联"（job 失败、
      # 日志 blob 根本不存在 → 看不到任何输出），需要区分「磁盘/内存耗尽」
      # 与「测试真的挂住」。输出 tee 到 diag.txt 并由下一步立即上传 artifact
      # —— artifact 在该步骤内就完成上传，即使后面的测试步骤把 runner 拖死
      # 也拿得到这份数据。
      - name: Diagnostics (disk/mem)
        run: |
          {
            echo "=== disk before build ==="; df -h /
            echo "=== mem ==="; free -m
            echo "=== cpus ==="; nproc
          } 2>&1 | tee diag.txt


      # cargo-nextest（替代 libtest）：解决"卡死时看不到卡点"的盲区——
      # 0.6.3 tag（d421fd8）Quality 的 unit tests 步骤曾卡在 in_progress 达 70 分钟
      # 被终止，后续步骤全 pending、Release 不出包；本地无法复现（Windows 全绿
      # 16–26s；WSL 高 IO 复刻自身崩溃 E_UNEXPECTED）。旧 libtest 并行下**卡住的
      # 测试名不会出现在日志**（未完成即无输出）；nextest 命中 slow-timeout 会立即
      # 打印 SLOW + 测试名，terminate-after 再拖若干周期即终止该测试（阈值见
      # .config/nextest.toml）；timeout-minutes 作最后防线。
      - uses: taiki-e/install-action@nextest

      # 单测拆两步：① 仅编译（冷编译 ~22 分钟，单独给 50 分钟）；② 分 4 片跑。
      #
      # 背景（0.6.3 tag b2d38de 实测）：编译 22m07s 成功后，nextest 一打印
      # "Starting 1683 tests across 3 binaries" 就 lost communication —— runner
      # 被进程/内存峰值拖死（官方文案：starves it for CPU/Memory / terminates
      # the runner process）。nextest 一次拉起 core/server/mcp 三个测试二进制、
      # 1683 个测试按核数并发，免费 runner 扛不住。
      #
      # 对策：编译独立成步（超时覆盖冷编译，不占用分片预算）；测试按 nextest
      # 内置 partition（按测试名 hash 均分，无需改测试代码）分 4 片顺序执行，
      # 并用 `-j 2` 限制并发——单次负载降到原来的几分之一。
      #
      # ⚠️ 包集合必须与测试步骤**逐字一致**（0.6.3 tag 040ec2e 实测教训）：
      # cargo 的 feature 统一范围取决于「本次选中的包集合」——`--workspace
      # --exclude tianyan-tauri` 编出的产物与 `-p tianyan-core` 的指纹不同，
      # 于是预编译白干、测试步骤从头重编整棵依赖树（datafusion/lance/arrow
      # 全套）：CI 日志实测 core 1/2 步骤 15 分钟全程 "Compiling"，一个测试
      # 都没跑到就被 timeout 杀掉（而 2 分钟前的上一步才刚报「编译完成」）。
      # 故此处与下面的分片步骤使用**同一个 `-p` 集合**；除 `--partition`/`-j`
      # （只影响测试选择，不影响编译指纹）外无任何参数差异。
      - name: Build tests (compile only)
        run: cargo nextest run -p tianyan-core -p tianyan-server -p tianyan-mcp --lib --no-run
        timeout-minutes: 50

      # 复用验证（关键诊断）：用与分片步骤**完全相同的参数**再跑一次
      # `--no-run`。若 cargo 编译指纹一致，这条应秒级返回；若又花十几分钟，
      # 说明「同参数」仍触发重编译——即分片步骤实际在编译而非跑测试，
      # 那 12 分钟超时必然不够、且 job 总时长会被拖到触发 runner 失联。
      - name: "Diagnostics (reuse probe: same cmd as shards)"
        run: |
          {
            echo "=== disk after build ==="; df -h /
            du -sh target 2>/dev/null || true
            free -m
            echo "=== timing: probe --no-run (expect <10s if reuse works) ==="
            time cargo nextest run -p tianyan-core -p tianyan-server -p tianyan-mcp --lib --no-run
            echo "=== disk after probe ==="; df -h /
          } 2>&1 | tee -a diag.txt
        timeout-minutes: 40

      # artifact 就地上传（**必须在会挂住的步骤之前**）：2026-10 实测把上传放在
      # libtest 对照步之后 ⇒ 该步挂住 + runner 失联 ⇒ 上传根本没执行、artifact
      # 为空，整轮诊断白跑。教训：诊断产物要"就近上传"，别指望挂住之后的步骤。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-probe-${{ github.run_id }}
          path: diag.txt
          retention-days: 5

      # ⭐ 判别实验（2026-10）：**单线程全量** libtest（`--test-threads=1`）。
      #
      # 要回答的问题：此前"全量一起跑必挂死（15–44 min，runner 失联）、按模块/分片
      # 跑就正常"到底是什么性质？
      #   - 本步**通过** ⇒ 与并发/资源竞争相关（候选：测试跨模块并发改
      #     `std::env::set_var`；各模块的 env 锁彼此不互斥，glibc 的 setenv 与
      #     分配器交互脆弱，而 Windows 的 `_putenv` 路径不同 ⇒ 解释"Linux 挂、
      #     Windows 全绿"）；
      #   - 本步**也挂** ⇒ 某个测试自身挂住，与并发无关 —— 单线程下 libtest 会
      #     逐个打印 `test X ... ok`，日志最后一条 ok 的**下一个测试即挂点**。
      # 位置刻意放在模块二分**之前**（无预热），否则"预热"假说会让结论失真。
      # 包集合与分片一致（复用编译产物）；`stdbuf -oL` 行缓冲让进度即时可见。
      - name: "Diagnostics (libtest SINGLE-THREAD full run)"
        run: |
          set +e
          stdbuf -oL -eL timeout 900 cargo test -p tianyan-core -p tianyan-server -p tianyan-mcp --lib -- --test-threads=1 > st1.log 2>&1
          code=$?
          echo "single-thread exit=$code" | tee -a diag.txt
          grep -E '^test result:' st1.log | tee -a diag.txt
          echo "--- last 30 lines (the line after the last ok is the hung test) ---" | tee -a diag.txt
          tail -30 st1.log | tee -a diag.txt
        timeout-minutes: 25

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-singlethread-${{ github.run_id }}
          path: |
            diag.txt
            st1.log
          retention-days: 5

      # ⭐ 模块二分（2026-10，替代先前的 libtest 对照步）。
      #
      # 对照结论（8800e28 实测）：**同一份已编译产物换 libtest（cargo test）也挂住**
      # ⇒ 问题**不在 nextest**，而在"某个测试在 Linux CI 上把 runner 拖死"
      # （官方文案：starves it for CPU/Memory / terminates the runner process）。
      # 旁证：本机 Windows 用 libtest 全量 1485 测试 22s 全绿；WSL 单线程跑到 767 个
      # 后崩（环境性）——Linux 侧确实存在"跑到某处就出事"的点。
      # 故转为**模块二分**：逐模块串行、每模块独立 `timeout 300`，结果同时写
      # stdout 与 $GITHUB_STEP_SUMMARY（步骤级收集，比 job 日志更抗失联）。
      - name: "Diagnostics (module bisect: serial, per-module timeout)"
        run: |
          set +e
          for m in agent common config context db events executor goals knowledge model observability roles scheduler session skills snapshot todos vfs; do
            echo "=== MODULE $m ==="
            timeout 300 cargo test -p tianyan-core --lib -- "${m}::" --test-threads=2 > "mod_$m.log" 2>&1
            code=$?
            line="MODULE $m exit=$code ok=$(grep -c ' \.\.\. ok$' mod_$m.log) $(grep -E '^test result:' mod_$m.log | tail -1)"
            echo "$line"
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "=== module bisect done ==="
        timeout-minutes: 60

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-bisect-${{ github.run_id }}
          path: |
            diag.txt
            mod_*.log
          retention-days: 5

      # 分片：nextest 内置 partition（按测试名 hash 均分），4 片让单片测试量
      # 降到 1/4；`-j 2` 限制同时运行的测试进程数（默认 = 核数），避免 1683
      # 全并发把 runner 拖死。任一片失败时范围清晰（hash 分片结果可复现）。
      - name: Rust unit tests (1/4)
        run: cargo nextest run -p tianyan-core -p tianyan-server -p tianyan-mcp --lib --partition count:1/4 -j 2
        timeout-minutes: 12

      - name: Rust unit tests (2/4)
        run: cargo nextest run -p tianyan-core -p tianyan-server -p tianyan-mcp --lib --partition count:2/4 -j 2
        timeout-minutes: 12

      - name: Rust unit tests (3/4)
        run: cargo nextest run -p tianyan-core -p tianyan-server -p tianyan-mcp --lib --partition count:3/4 -j 2
        timeout-minutes: 12

      - name: Rust unit tests (4/4)
        run: cargo nextest run -p tianyan-core -p tianyan-server -p tianyan-mcp --lib --partition count:4/4 -j 2
        timeout-minutes: 12

      # 集成测试（core/tests + server/tests，含 HTTP 级 e2e）——此前只在本地
      # `test.ps1 integration` 跑，CI 从未覆盖；0.5.8 记录"三处 e2e 断言失效
      # 长期未被察觉"即该缺口所致。
      - name: Rust integration tests (incl. e2e)
        run: cargo test --workspace --exclude tianyan-tauri --test "*"

      # 工具目录 freshness：命令来自仓库 `.cargo/config.toml` 的 alias
      # （`catalog-check`）——**命令单一来源**，CI 不再内联 cargo 命令行，
      # 杜绝"生成器换包/换位置后 CI 未同步"的漂移。0.5.9 实发事故：生成器
      # 由 core 迁到 server 侧（组件工具也要进目录），本地脚本已改而 CI 里
      # 内联的 `-p tianyan-core` 未同步 → `no example target named
      # tool_catalog` → 门禁必红 → release 的 build 因 `needs: quality`
      # 被跳过（tag 推送后不出包）。换生成器位置现在只改 `.cargo/config.toml`。
      - name: Tool catalog freshness
        run: cargo catalog-check

      - name: Frontend deps
        run: cd gui-vite && npm ci

      - name: Frontend lint (eslint + prettier)
        run: cd gui-vite && npm run lint

      - name: Frontend typecheck
        run: cd gui-vite && npm run typecheck

      - name: Frontend unit tests
        run: cd gui-vite && npm test
