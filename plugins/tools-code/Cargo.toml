tree-sitter-python.workspace = true
tree-sitter-go.workspace = true
# 内嵌搜索（ignore 遍历 + regex 匹配）
ignore.workspace = true
regex.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
