[package]
name = "tianyan-policy-review"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "天演评审策略插件：后台任务结果自审（LLM-as-Judge）"

[dependencies]
tianyan = { path = "../../core", package = "tianyan-core" }
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
# 测试替身（`MockChatService` / `MockVfs`）与「真实实现」的构造需求：core 的
# `test_utils` 默认不编译，插件测试要复用它（否则只能复制一份替身 → 两份实现同时
# 漂移）。用法与 `plugins/task-builtin` / `policy-approval` / `policy-context` 同源。
tianyan = { path = "../../core", package = "tianyan-core", features = ["test-utils"] }
