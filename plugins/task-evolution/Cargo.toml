[package]
name = "tianyan-task-evolution"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "天演任务插件：自演化综述任务（ADR-017 三阶段编排；记忆/技能/规则/组织形态统一演化）"

[dependencies]
tianyan = { path = "../../core", package = "tianyan-core" }
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
# 单元测试**原样复用 core 的测试替身**（MockVfs / MockChatService /
# InMemoryVectorStorage）：演化任务的内联测试迁移前全部基于 MockVfs（`add_entry` /
# `add_directory` 用来构造「目录形态 vs 文件形态」的条目差异——`find_entry` 缺陷
# 正是靠这个面锁住的）。`test-utils` 是 core 的**可选特性**，仅在测试构建打开：
# 生产构建（`cargo build`）里 core 不编译 mockall。
tianyan = { path = "../../core", package = "tianyan-core", features = ["test-utils"] }
# **测试期插件间依赖**（ADR-049 期 2 序 5b）：`real_vfs()` 必须用真实
# `SqliteBackend` 锁定生产条目形态（文件条目 vs 目录条目），换成 MockVfs / 本地文件
# 后端会把「Mock 形态掩盖缺陷」这条教训重新引入。core 的做法是 `#[path]` 同源包含
# 插件源码——那是为了绕开「同一 crate 两个编译单元」；本 crate 是**独立 crate**，
# 可以干净地用 dev-dependency（与 `plugins/storage-vector/examples` 同一先例）。
# 生产依赖图不受影响：`cargo tree -p tianyan-task-evolution --edges normal` 里没有它。
tianyan-storage-sqlite = { path = "../storage-sqlite" }
