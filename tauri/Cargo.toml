[package]
name = "tianyan-tauri"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tauri desktop application for Tianyan"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tianyan-core = { path = "../core" }
tianyan-server = { path = "../server" }

# Tauri framework
tauri = { version = "2.2", features = ["tray-icon", "devtools"] }
tauri-plugin-shell = "2.2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
rfd = "0.17"

# HTTP server
axum = { version = "0.8", features = ["multipart"] }

# Core dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

# Utilities
reqwest = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
dirs = "5.0"

[lints]
workspace = true

[lib]
name = "tianyan_tauri_lib"
path = "src/lib.rs"
# 禁用 doctest：0 个示例，无任何测试价值
doctest = false

[[bin]]
name = "tianyan-tauri"
path = "src/main.rs"
