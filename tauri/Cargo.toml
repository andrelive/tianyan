[package]
name = "tianyan-tauri"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tauri desktop application for Tianyan"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tianyan-core = { path = "../core" }
tianyan-server = { path = "../server" }
# 服务层配置 crate（ADR-049 期 3-T4）：桌面端同样在启动期「加载 → 注入内核槽位」，
# 搬迁重启后再重读一次（与 `app/src/main.rs` 同源同形）。
tianyan-service-config = { path = "../service/config" }
# 装配清单单一实现（ADR-049 期 4）：11 个工厂与三份清单都在此，桌面端只调用
tianyan-assembly = { path = "../assembly" }
# 启动编排（单 server 发现与复用）：与 gui-native 共用同一份实现。
# 它只经 `tianyan-assembly::full()` 取插件清单，不直接认识插件 crate。
tianyan-desktop = { path = "../desktop" }

# Tauri framework
tauri = { version = "2.2", features = ["tray-icon", "devtools"] }
tauri-plugin-dialog = "2"
# 打开系统默认程序（外部链接转交默认浏览器；shell 插件的 open 已废弃，按官方建议改用 opener）
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
rfd = "0.17"
# 剪贴板「文件路径列表」（Windows CF_HDROP）：clipboard-manager 基于 arboard，
# 只支持 text/image，读不到资源管理器里 Ctrl+C 出来的文件集合，故另加 clipboard-rs
# （安全封装，无手写 FFI，满足 workspace `unsafe_code = "deny"`）。
# 关掉默认的 `image` feature：本 crate 只取文件列表，图片解码由前端通道负责，
# 不引入 bmp/png/jpeg 解码器（编译时间与体积）。
clipboard-rs = { version = "0.3", default-features = false }

# HTTP server
axum = { version = "0.8", features = ["multipart"] }

# Core dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

# Utilities
reqwest = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
dirs = "5.0"

[lints]
workspace = true

[lib]
name = "tianyan_tauri_lib"
path = "src/lib.rs"
# 禁用 doctest：0 个示例，无任何测试价值
doctest = false

[[bin]]
name = "tianyan-tauri"
path = "src/main.rs"
