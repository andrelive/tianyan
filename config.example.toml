# Tianyan 配置文件示例
# 将此文件复制为 tianyan.toml 并根据需要修改

# ==================== 智能体配置 ====================
[agent]
shortlist_tools = true
# 后台任务结果自审（G4，默认关闭 opt-in）：开启后后台任务完成通知注入前
# 经 LLM 自审，未通过则结果带 [自审未通过] 标记，由主 agent 复核
# （每个后台任务多一次小调用）。
# background_self_review = false
default_top_k = 5
# 工作目录：Agent 执行命令/读写文件的基础目录，也是会话回退时文件快照的根目录。
# 未配置时使用进程当前目录，且不启用文件快照回退。
# working_directory = "/path/to/your/project"

# ==================== 存储配置 ====================
[storage]
data_dir = "~/.tianyan"
max_storage_size = 0
auto_cleanup = true
cleanup_days = 365

[storage.vector]
collection_name = "tianyan_contexts"
# 向量维度需与嵌入模型输出维度一致：
#   text-embedding-3-small: 1536
#   text-embedding-3-large: 3072
#   text-embedding-v4:      1024
vector_dimension = 1536

# ==================== 模型配置 ====================
#
# 模型配置采用 Provider → Model 二级结构：
#   1. 先配置提供商（name, endpoint, api_key）
#   2. 在每个提供商下声明其支持的模型和能力标签
#   3. 在 preferences 中指定各能力首选模型
#
# 每个模型条目（[[models.providers.models]]）可选三个规格字段，平铺在与
# name / capabilities 同级的位置（均为可选，不配置则走回退）：
#   context_length     — 上下文总窗口，输入与输出共享的 token 数
#   max_output_tokens  — 单次生成的最大输出 token 数（含思考链；请求时按
#                        「窗口 − 输入」动态收缩，此值仅为上限）
#   max_input_tokens   — 仅 embedding 模型生效，单次向量化输入的上限
#
# 字段解析优先级：显式配置 > 内置规格表 > 全局默认（32K 窗口 / 8K 输出）。
# 内置规格表按 provider + 模型名前缀自动匹配主流模型（gpt-4o、claude、
# qwen、llama、deepseek-v4-flash 等），因此大多数用户无需配置这三个字段。
# 确有需要时，从模型官方规格页抄两个数字即可，例如 gpt-4o：
#   context_length = 128000
#   max_output_tokens = 16000

# --- 模型提供商 ---

# OpenAI — chat + embedding + vision 全覆盖
[[models.providers]]
name = "openai"
endpoint = "https://api.openai.com/v1"
api_key = "${OPENAI_API_KEY}"

[[models.providers.models]]
name = "gpt-4"
capabilities = ["chat"]
# 规格字段写法示例（仅注释，取消注释即生效）：
# context_length = 8192
# max_output_tokens = 4096

[[models.providers.models]]
name = "gpt-4-vision-preview"
capabilities = ["chat", "vision"]

[[models.providers.models]]
name = "text-embedding-3-small"
capabilities = ["text-embedding"]
# embedding 模型只需配置 max_input_tokens（其余字段不生效）：
# max_input_tokens = 8192

[[models.providers.models]]
name = "text-embedding-3-large"
capabilities = ["text-embedding", "multimodal-embedding"]

# DeepSeek — 推理专用，不提供 embedding
# [[models.providers]]
# name = "deepseek"
# endpoint = "https://api.deepseek.com/v1"
# api_key = "${DEEPSEEK_API_KEY}"
#
# [[models.providers.models]]
# name = "deepseek-chat"
# capabilities = ["chat"]
#
# [[models.providers.models]]
# name = "deepseek-coder"
# capabilities = ["chat"]

# Ollama 本地服务 — OpenAI 兼容端点（/v1）与原生协议（/api/version、/api/tags）
# [[models.providers]]
# name = "ollama"
# endpoint = "http://localhost:11434/v1"
# api_key = ""
#
# 传输层思考字段名（可选，thinking_field）：
#   历史 assistant 消息的思考内容用哪个 wire 字段名回传。
#   "reasoning_content"（DeepSeek / OpenAI 生态）| "reasoning"（ollama 兼容层）。
#   不配置时按 endpoint/名称嗅探：含 ollama 或 :11434 → reasoning，其余 → reasoning_content。
#   发错字段名不会报错（服务端忽略未知字段），但思考内容会被静默丢弃、根本没进 prompt。
#   自建代理/嗅探不到的网关用此项显式指定，例如：
#   thinking_field = "reasoning"
#
# 本地 chat 模型示例（128K 上下文，输出上限 32K）：
# [[models.providers.models]]
# name = "qwen2.5-72b-instruct"
# capabilities = ["chat"]
# context_length = 131072
# max_output_tokens = 32768

# --- 能力偏好（可选） ---
# 不配置则自动匹配第一个符合条件的模型
[models.preferences]
chat = { provider = "openai", model = "gpt-4" }
embedding = { provider = "openai", model = "text-embedding-3-small" }
vision = { provider = "openai", model = "gpt-4-vision-preview" }

# 跨提供商混合示例：
# chat      → DeepSeek（推理强）
# embedding → OpenAI （嵌入好）
# vision    → OpenAI （多模态）
#
# [models.preferences]
# chat = { provider = "deepseek", model = "deepseek-chat" }
# embedding = { provider = "openai", model = "text-embedding-3-small" }
# vision = { provider = "openai", model = "gpt-4-vision-preview" }

# ==================== 日志配置 ====================
# level / format 生效；日志级别也可用 RUST_LOG 环境变量覆盖
[logging]
level = "info"
format = "text"
include_location = false

# ==================== 安全配置 ====================
[security]
enabled = true
# 审批行为模式（ADR-033）：autonomous（默认，黑名单外全放行）/ confirm（危险操作询问）/
# interactive（挂起等待审批面板）。
approval_mode = "autonomous"
# 命令检查层模式（ADR-033）：relaxed（默认，跳过元字符/解释器检查、黑名单兜底）/
# strict（元字符/解释器检查）/ transform（危险命令改写为回收站）/ permissive（跳过一切检查）。
safety_mode = "relaxed"
allowed_directories = []
blocked_directories = ["/", "/etc", "/bin", "/sbin", "/usr/bin", "/usr/sbin"]
allowed_commands = []
blocked_commands = ["rm -rf /", "format", "del /s", "rd /s"]
# "总是询问"命令列表：命中的命令强制走人工审批/询问（不被自动放行）。默认空。
prompt_commands = []
max_file_size = 104857600
audit_logging = true

# ==================== 记忆配置 ====================
[memory]
max_session_memory = 8000
max_long_term_memory = 10000
importance_threshold = 0.5
auto_consolidation = true
consolidation_interval = 3600
decay_rate = 0.01
# 偏好类记忆写前校验（G3，默认关闭 opt-in）：开启后 MemoryTask 对
# preferences 类别记忆先经 LLM 校验（是否稳定长期偏好）再持久化，
# 未通过/校验失败的记忆被丢弃。每提取周期仅对偏好类记忆多一次小调用。
# verify_preferences = false

# ==================== 检索配置 ====================
[retrieval]
default_top_k = 10
min_score = 0.5
two_stage_retrieval = true
l0_multiplier = 3
max_context_tokens = 4000
enable_cache = true
cache_ttl = 300

# ==================== Web 工具配置 ====================
# web_search / web_fetch 工具（Agent 的网页感知能力）
[web]
enabled = true
# 搜索后端：duckduckgo（默认，零配置）或 searxng（自托管/公共实例）
search_backend = "duckduckgo"
# search_backend = "searxng" 时必填，如 "https://searx.be"
# searxng_endpoint = "https://searx.be"
# HTTP 超时（秒）
timeout_secs = 15
# 搜索/抓取结果缓存 TTL（秒）
cache_ttl_secs = 600
# 单次抓取响应大小上限（字节）
max_fetch_bytes = 2097152

# ==================== MCP 服务器配置 ====================
# 通过 MCP 协议接入外部工具服务器，工具自动注册进 Agent 工具循环。
# 传输方式（G7）：
#   transport = "stdio"（默认）—— 本地子进程（command + args）
#   transport = "http"  —— 远程 streamable HTTP 服务器（需配置 url，
#                          如 GitHub MCP / 云服务 MCP；对齐 2026-07-28
#                          stateless 核心规范）
# 服务器名必须唯一；enabled = false 时仅保存配置不连接。
#
# 浏览器感知示例（Playwright MCP，微软官方）：
# 使 Agent 获得网页导航/点击/填表/截图等完整浏览器能力。
# 前置要求：Node.js 18+（npx 可用），首次连接时自动下载 Chromium（约 150MB）。
# 截图会保存到 {data_dir}/mcp_images/ 并以路径形式返回给 Agent。
#
# [[mcp.servers]]
# name = "playwright"
# command = "npx"
# args = ["-y", "@playwright/mcp@latest", "--headless"]
# enabled = true
# description = "浏览器自动化（导航/点击/截图）"
#
# 远程服务器示例（streamable HTTP）：
# [[mcp.servers]]
# name = "remote-github"
# transport = "http"
# url = "https://mcp.example.com/mcp"
# command = "unused"
# args = []
# enabled = true
#
# 通用示例（文件系统服务器）：
# [[mcp.servers]]
# name = "filesystem"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
# enabled = false

# ==================== 子 Agent 角色配置 ====================
# delegate_to_agent 工具的 role 参数按名字选择角色；内置角色：
#   researcher（检索/调研）、editor（代码编辑）、reviewer（验证/评审）。
# 同名角色整体覆盖内置定义，新名字新增角色。
# 角色字段（均可省略，缺省回落主 Agent 配置）：
#   model         角色模型名（缺省回落主 Agent 模型）
#   system_prompt 角色系统提示（缺省无）
#   tools         工具白名单（缺省不限制；白名单外工具调用被拒绝并回喂模型）
#   max_turns     子 Agent 最大循环轮数（缺省 200）
#   timeout_secs  委托整体超时（秒，缺省不限制）
#
# [agent_roles.researcher]
# model = "deepseek-r1"
# system_prompt = "你是检索调研助手。"
# tools = ["web_search", "web_fetch", "search_knowledge", "read_file"]
# max_turns = 30
# timeout_secs = 300
