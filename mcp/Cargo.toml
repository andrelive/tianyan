[package]
name = "tianyan-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MCP (Model Context Protocol) client for Tianyan - manages MCP server connections"
readme = "../README.md"
keywords = ["mcp", "client", "protocol", "ai", "tools"]
categories = ["development-tools"]

[lib]
name = "tianyan_mcp"
path = "src/lib.rs"
# 禁用 doctest：避免改动后 doctest 目标重编
doctest = false

[dependencies]
rust-mcp-sdk = { version = "0.9", default-features = false, features = ["client", "stdio", "streamable-http"] }
tianyan-core = { path = "../core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
