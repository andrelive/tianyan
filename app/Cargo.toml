[package]
name = "tianyan-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "天演装配器（bin）：唯一 use 具体插件类型的地方（ADR-049 期 1）"

[[bin]]
name = "tianyan-server"
path = "src/main.rs"

[dependencies]
tianyan = { path = "../core", package = "tianyan-core" }
tianyan-server = { path = "../server" }
# 插件清单：**只在本包出现**——server 库因此不依赖插件 crate，
# 改一行工具只重编插件 + 本 bin（闸门 A 前提）
tianyan-tools-fs = { path = "../plugins/tools-fs" }
# 插件清单：**只在本包出现**——server 库因此不依赖插件 crate，
# 改一行工具只重编插件 + 本 bin（闸门 A 前提）
tianyan-tools-code = { path = "../plugins/tools-code" }
# 插件清单：**只在本包出现**——server 库因此不依赖插件 crate。
# todo/goal 例外地需要 store：装配层从 AppState 取同一实例传入插件。
tianyan-tools-todo = { path = "../plugins/tools-todo" }
# 插件清单：`web_search` / `web_fetch`（ADR-049 期 2）。
tianyan-tools-web = { path = "../plugins/tools-web" }
tokio.workspace = true

[lints]
workspace = true

[dev-dependencies]
# 装配级测试需要临时目录承载 `todo` / `goal` 的 store（与 REST API 共享实例）
tempfile.workspace = true
