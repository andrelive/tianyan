[package]
name = "tianyan-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "天演装配器（bin, headless）：配置加载 + 日志 + 启动 + 搬迁重启；装配清单取自 tianyan-assembly（ADR-049 期 1 / 期 4）"

[[bin]]
name = "tianyan-server"
path = "src/main.rs"

[dependencies]
tianyan = { path = "../core", package = "tianyan-core" }
tianyan-server = { path = "../server" }
tianyan-service-config = { path = "../service/config" }
# 装配清单（ADR-049 期 4）：11 个工厂 + 两份清单的唯一实现在此，本包只调用
tianyan-assembly = { path = "../assembly" }
# 工具目录渲染口径（`examples/tool_catalog.rs`）：实现随工具管线插件走（期 3-T5）
tianyan-tool-pipeline = { path = "../plugins/tool-pipeline" }
tokio.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
