[workspace]
members = ["core", "server", "tauri", "mcp"]
resolver = "2"

[workspace.package]
# 产品版本：与 tauri/tauri.conf.json 保持一致（后者决定 MSI 名与 ProductVersion；
# 此处决定各 crate 版本与 exe 文件属性 FileVersion/ProductVersion）。
version = "0.5.10"
edition = "2021"
authors = ["Tianyan Team"]
license = "MIT"
repository = "https://github.com/andrelive/tianyan"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["derive"] }
clap = { version = "4.4", features = ["derive", "env", "string"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
config = "0.14"
thiserror = "1.0"
anyhow = "1.0"

# Cryptography
ring = "0.17"

# Vector database (embedded)
lancedb = "0.33"

# Document processing
pulldown-cmark = "0.9"
pdf-extract = "0.7"
docx-rs = "0.4"

# Image processing
image = "0.24"
kamadak-exif = "0.5"

# Data processing
csv = "1.3"
calamine = "0.22"

# Async utilities
async-trait = "0.1"
futures = "0.3"

# OpenAI API client
async-openai = { version = "0.34", features = ["byot", "chat-completion-types", "chat-completion", "embedding-types", "embedding", "model"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# URL parsing
url = "2.5"

# TOML parsing
toml = "0.8"

# Directory handling
dirs = "5.0"

# Base64 encoding
base64 = "0.22"

# Usage statistics
rusqlite = { version = "0.31", features = ["bundled"] }
dashmap = "6.1"

# Regular expressions
regex = "1.10"

# 目录遍历（rg 同作者：.gitignore/隐藏文件语义，搜索内嵌用）
ignore = "0.4"

# 文本相似度比较
similar = "3.1.2"

# 压缩 / 解压
flate2 = "1"

# Cargo 元数据解析（Message::parse_stream 默认可用）
cargo_metadata = "0.23"

# 语法解析（tree-sitter）
# 注意：runtime 需 ≥0.25 —— 最新 grammar 补丁（tree-sitter-rust 0.24.x、
# tree-sitter-python 0.23.6 等）由 tree-sitter 0.25 生成器重新生成（grammar ABI 15），
# 0.24.x runtime（最高 ABI 14）无法加载（Incompatible language version 15）。
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"


# Dev dependencies
tempfile = "3.10"
mockall = "0.13"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
too_many_arguments = "warn"
type_complexity = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# 任务级 panic 隔离（2026-09-14 自 "abort" 改回；闪退事故的放大器下线）：
# abort 策略下任何线程的 panic 即刻终止整个进程（无 unwind、无日志、GUI 无痕
# 消失）；"unwind" 下 panic 被任务边界隔离（tokio JoinError / catch_unwind 可
# 捕获），并配合 core::common::panic_hook 把现场落盘（最后防线）。
# 背景：2026-09-14 中文截断 panic × abort 放大为全进程无痕退出（提交 150191a）。
panic = "unwind"

[profile.release.package."*"]
opt-level = 3

[profile.dev]
opt-level = 0
debug = 1
# 关闭增量编译：`target/debug/incremental` 会随**每次编译会话**新增一个目录，
# 且旧会话目录 cargo 永不回收——2026-09-21 实测累积 **1203 个会话目录 / 179 GB**，
# 其中 74% 是 3 天前的死数据（曾导致 F: 盘写满、编译报 os error 112）。
# 本项目工作流以「频繁全量编译 + 测试」为主（agent/CI 场景），增量收益小、
# 磁盘膨胀大。需要增量调试时用环境变量临时覆盖：`$env:CARGO_INCREMENTAL = "1"`。
incremental = false

[profile.test]
opt-level = 2

[profile.dev-fast]
inherits = "dev"
opt-level = 2
debug = false

[profile.minimal]
inherits = "release"
opt-level = "z"
lto = "fat"
