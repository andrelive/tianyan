[workspace]
members = ["core", "server", "tauri", "mcp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Tianyan Team"]
license = "MIT"
repository = "https://github.com/andrelive/tianyan"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["derive"] }
clap = { version = "4.4", features = ["derive", "env", "string"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
config = "0.14"
thiserror = "1.0"
anyhow = "1.0"

# Cryptography
ring = "0.17"

# Vector database (embedded)
lancedb = "0.33"

# Document processing
pulldown-cmark = "0.9"
pdf-extract = "0.7"
docx-rs = "0.4"

# Image processing
image = "0.24"
kamadak-exif = "0.5"

# Data processing
csv = "1.3"
calamine = "0.22"

# Async utilities
async-trait = "0.1"
futures = "0.3"

# OpenAI API client
async-openai = { version = "0.34", features = ["byot", "chat-completion-types", "chat-completion", "embedding-types", "embedding", "model"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# URL parsing
url = "2.5"

# TOML parsing
toml = "0.8"

# Directory handling
dirs = "5.0"

# Base64 encoding
base64 = "0.22"

# Usage statistics
rusqlite = { version = "0.31", features = ["bundled"] }
dashmap = "6.1"

# Regular expressions
regex = "1.10"

# Dev dependencies
tempfile = "3.10"
mockall = "0.13"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
too_many_arguments = "warn"
type_complexity = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = 3

[profile.dev]
opt-level = 0
debug = 1

[profile.test]
opt-level = 2

[profile.dev-fast]
inherits = "dev"
opt-level = 2
debug = false

[profile.minimal]
inherits = "release"
opt-level = "z"
lto = "fat"
