[package]
name = "tianyan-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "GUI frontend for Tianyan"

[dependencies]
# Yew framework
yew = { version = "0.22", features = ["csr"] }

# HTTP client for WASM
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-utils = "0.2"
gloo-console = "0.3"
gloo-events = "0.2"

# WebAssembly bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "DataTransfer",
    "DragEvent",
    "File",
    "FileList",
    "FormData",
    "Headers",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestInit",
    "Response",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "DomTokenList",
    "console",
    "ScrollToOptions",
    "ScrollBehavior",
    "Navigator",
    "Clipboard",
] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# UUID - 使用 js feature 以支持 WASM 目标
uuid = { workspace = true, features = ["js", "v4"] }

# URL encoding
urlencoding = "2"

# Async utilities
futures = "0.3"

# Markdown rendering
pulldown-cmark = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
wasm-bindgen-test = "0.3"


